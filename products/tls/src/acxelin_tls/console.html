<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin QGuard</title>
<style>
/*SHELL*/
[hidden]{display:none!important}
.inline-acts{flex-wrap:wrap;gap:6px}
.copyable{display:grid;gap:6px;justify-items:start;min-width:0}.copyable pre{margin:0;max-width:100%;overflow-x:auto;white-space:pre;font-size:12.5px}
.path{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;word-break:break-all}
.svc{border-top:1px solid var(--rule);padding:18px 0}
.svc:first-of-type{border-top:0}
.svc h2{margin:0}
.svc .sub{color:var(--muted);margin:2px 0 8px}
.svc ul.problems{margin:8px 0 0;padding-left:18px;color:var(--ink)}
.svc ul.problems li{margin:3px 0}
.section{margin-top:34px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:13.5px;color:var(--ink);margin:18px 0 6px;padding:0}
.choices{display:grid;gap:8px}
.choices label{display:flex;gap:10px;align-items:flex-start;margin:0;font-weight:400;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--pane);cursor:pointer}
.choices label:has(input:checked){border-color:var(--ink)}
.choices input{margin-top:3px}
.choices strong{display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{margin-top:3px}
.form{max-width:620px}
.form .msg{margin-top:14px}
.form-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:0 14px}
@media (max-width:560px){.form-row{grid-template-columns:minmax(0,1fr)}}
.verdict{font:500 17px/1.4 var(--display);color:var(--ink);margin:0 0 10px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.downloads{margin-top:8px}
.attention{margin:6px 0 0;padding-left:18px}.attention li{margin:5px 0;color:var(--ink)}
.token{font-family:var(--mono);font-size:13px;background:var(--sunken);padding:6px 8px;border-radius:4px;overflow-wrap:anywhere}
input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--pane);border:1px solid var(--rule-strong);border-radius:6px;padding:9px 11px;min-height:40px}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin QGuard</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p>
<div id="app" aria-live="polite"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const say = (text) => { const m = $("#msg"); m.textContent = text || ""; if (text) m.scrollIntoView({block: "center", behavior: "smooth"}); };
const state = {tab: "overview", status: null, services: null, first: false, editing: null, check: null};
// An error goes next to the form it came from (`where`, a role=alert element), or to the top of the page.
async function call(path, body, where) {
  if (where) where.textContent = ""; else say("");
  try { return await acx.api(path, body); }
  catch (e) {
    const text = e.status === 401 ? "This session has ended. Run acxelin-qguard console again to open a new one." : e.message;
    if (where) { where.textContent = text; where.scrollIntoView({block: "nearest"}); } else say(text);
    throw e;
  }
}
const alertBox = () => h("p", {class: "msg", role: "alert"});
const when = (t) => { if (!t) return ""; const d = new Date(t.replace(/Z?$/, t.endsWith("Z") || /[+-]\d\d:\d\d$/.test(t) ? "" : "Z")); return isNaN(d) ? t : d.toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"}); };
const day = (t) => { if (!t) return ""; const d = new Date(t); return isNaN(d) ? t.slice(0, 10) : d.toLocaleDateString(undefined, {dateStyle: "medium"}); };
const field = (id, label, input, hint) => [h("label", {for: id}, label), input, hint ? h("p", {class: "legend", id: id + "-hint"}, hint) : ""];
function copyable(text, label = "Copy") {
  const b = h("button", {class: "btn quiet small", type: "button"}, label);
  b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; } catch (e) { b.textContent = "Select and copy"; } });
  return h("div", {class: "copyable"}, h("pre", {tabindex: "0"}, h("code", {}, text)), b);
}
// A destructive button asks once more: the first click arms it for six seconds and says so.
function twoStep(label, aria, confirmText, run) {
  const b = h("button", {class: "btn quiet small", type: "button", "aria-label": aria}, label);
  let armed = false, timer;
  const set = (a) => { armed = a; b.textContent = a ? confirmText : label; b.setAttribute("aria-label", a ? confirmText : aria); b.className = "btn small " + (a ? "danger" : "quiet"); };
  b.addEventListener("click", async () => {
    if (!armed) { set(true); timer = setTimeout(() => set(false), 6000); return; }
    clearTimeout(timer);
    try { await run(); } catch (e) { set(false); }
  });
  return b;
}

// ---- first run, unlock and sign-in

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-qguard console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-qguard console link"), " in that session.")));
}

function createCa() {
  const name = h("input", {type: "text", id: "ca-name", autocomplete: "off", placeholder: "for example: Acme Corp Root CA", required: true});
  const pass = h("input", {type: "password", id: "ca-pass", autocomplete: "new-password", "aria-describedby": "ca-pass-hint"});
  const again = h("input", {type: "password", id: "ca-pass2", autocomplete: "new-password"});
  const go = async () => {
    if (pass.value !== again.value) { say("The two passphrases are different. Type the same passphrase in both boxes."); again.select(); return; }
    try { await call("ca/create", {name: name.value, passphrase: pass.value || null}); state.first = true; await load(); } catch (e) {}
  };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("p", {class: "mute"}, "Step 1 of 2"), h("h1", {}, "Create your certificate authority"),
    h("p", {class: "lede"}, "QCertificate is your own certificate authority. It issues the quantum-safe certificates your services and partners use, and nobody outside your organisation holds its key."),
    ...field("ca-name", "Name", name, ""), ...field("ca-pass", "Passphrase (recommended)", pass, "Protects the authority's key. The console keeps it in memory only, so you type it again after a restart. Without one, the key file is stored unencrypted."),
    ...field("ca-pass2", "Repeat passphrase", again),
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", type: "button", onclick: go}, "Create certificate authority")),
    h("details", {style: "margin-top:22px"}, h("summary", {}, "Technical details"), h("p", {class: "legend"}, "The authority signs with ML-DSA-87 (FIPS 204), a post-quantum signature. Its files live in the console's data folder (Settings shows where)."))));
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  name.focus();
}

function unlock() {
  const pass = h("input", {type: "password", id: "unlock-pass", autocomplete: "current-password"});
  const go = async () => { try { await call("ca/unlock", {passphrase: pass.value}); await load(); } catch (e) { pass.select(); } };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Unlock the certificate authority"),
    h("p", {class: "lede"}, "The key of " + state.status.name + " is protected by a passphrase. Type it to issue, renew and revoke certificates and to protect services."),
    ...field("unlock-pass", "Passphrase", pass), h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", type: "button", onclick: go}, "Unlock"))));
  pass.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  pass.focus();
}

// ---- the shell

const TABS = [["overview", "Overview"], ["services", "Services"], ["ca", "QCertificate"], ["check", "Check a connection"], ["settings", "Settings"]];
function shell() {
  const tab = (id, label) => h("button", {role: "tab", type: "button", id: "tab-" + id, "aria-selected": String(state.tab === id), "aria-controls": "panel", tabindex: state.tab === id ? "0" : "-1", onclick: () => go(id)}, label);
  const list = h("div", {class: "tabs", role: "tablist", "aria-label": "Console sections"}, TABS.map(([id, l]) => tab(id, l)));
  list.addEventListener("keydown", (e) => {
    const i = TABS.findIndex(([id]) => id === state.tab), n = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (n) { go(TABS[(i + n + TABS.length) % TABS.length][0]); $("#tab-" + state.tab).focus(); }
  });
  $("#app").replaceChildren(list, h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  ({overview: overviewView, services: servicesView, ca: caView, check: checkView, settings: settingsView})[state.tab]();
}
function go(id) { state.tab = id; say(""); shell(); }
async function refresh() { state.status = await call("status"); state.services = await call("services"); }

// ---- words for settings

const PROTECTION = (s) => s.policy === "transition" ? "Quantum-safe, browsers welcome" : s.shadow ? "Watching: nothing is refused yet" : s.policy === "cnsa2" ? "CNSA 2.0 only" : "Quantum-safe only";
const TECH = (s) => s.policy + (s.shadow ? ", shadow = true" : "") + (s.forwarded ? ", forwarded_headers = true" : "") + (s.mode === "originate" ? ", originate" : "");
function pill(s) {
  if (s.shadow) return h("span", {class: "pill warn"}, "Watching");
  return h("span", {class: "pill ok"}, s.policy === "transition" ? "Serving" : "Enforcing");
}
function seen(s) {
  const t = s.status;
  if (!t) return "No connections seen (QGuard is not running)";
  if (!t.handshakes && !t.would_refuse && !t.refused && !t.distrusts) return "No connections yet";
  const parts = [t.quantum_safe + " of " + t.handshakes + " connections quantum-safe"];
  if (t.refused) parts.push(t.refused + " refused");
  if (t.would_refuse) parts.push(t.would_refuse + " would be refused once enforcing");
  if (t.distrusts) parts.push(t.distrusts + " did not trust the certificate");
  return parts.join(" · ");
}

// ---- overview

const loading = (title) => $("#panel").replaceChildren(h("h1", {}, title), h("p", {class: "state"}, "Loading…"));
async function overviewView() {
  const panel = $("#panel");
  loading("Overview");
  try { await refresh(); } catch (e) { return; }
  const svc = state.services, list = svc.services;
  const running = svc.running;
  const attention = [];
  for (const s of list) for (const p of s.problems) attention.push(s.host ? s.host + ":" + s.port + ": " + p : s.name + ": " + p);
  if (list.length && !running) attention.push("QGuard is not running, so these services are not protected yet. Start it in Services.");
  for (const s of list) if (s.shadow && s.status && s.status.handshakes && !s.status.would_refuse) attention.push(s.host + ":" + s.port + " is ready: nobody it has seen would be refused. Turn on enforcement in Services.");
  const c = state.status.counts;
  if (c.expiring) attention.push(c.expiring + " certificate" + (c.expiring > 1 ? "s expire" : " expires") + " within 30 days: renew in QCertificate.");
  const crl = state.status.crl;
  if (!crl) attention.push("QCertificate has no revocation list yet: refresh it in QCertificate.");
  else if (crl.days_left < 2) attention.push("The revocation list ends in " + Math.max(0, Math.floor(crl.days_left)) + " days: refresh it in QCertificate.");
  const rows = list.map((s) => h("tr", {}, h("td", {"data-label": "Service"}, s.host ? s.host + ":" + s.port : s.name), h("td", {"data-label": "Kind"}, s.label),
    h("td", {"data-label": "Protection"}, PROTECTION(s)), h("td", {"data-label": "Mode"}, pill(s)), h("td", {"data-label": "Seen"}, seen(s))));
  panel.replaceChildren(h("h1", {}, "Overview"),
    h("p", {class: "lede"}, running ? "QGuard is running and protecting the services below." : "QGuard is not running."),
    h("h2", {}, "Protected services"),
    list.length ? h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Protected services"}, h("table", {}, h("thead", {}, h("tr", {}, ["Service", "Kind", "Protection", "Mode", "Seen"].map((x) => h("th", {}, x)))), h("tbody", {}, rows)))
      : h("div", {}, h("p", {class: "empty"}, "No services yet."), h("button", {class: "btn", type: "button", onclick: () => go("services")}, "Protect a service")),
    h("h2", {class: "section"}, "Needs attention"),
    attention.length ? h("ul", {class: "attention"}, attention.map((a) => h("li", {}, a))) : h("p", {class: "empty"}, "Nothing needs your attention."));
}

// ---- services

async function servicesView() {
  const panel = $("#panel");
  if (!panel.querySelector("h1")) loading(state.services && !state.services.services.length ? "Protect your first service" : "Services");
  try { await refresh(); } catch (e) { return; }
  const svc = state.services;
  const first = !svc.services.length;
  const showForm = first || state.editing !== null;
  const top = [h("h1", {}, first ? "Protect your first service" : "Services"),
    h("p", {class: "lede"}, "A protected service is the name and port people use, and where the service runs now. QGuard sits in between: everything that reaches the service has come over a quantum-safe connection, and the service itself does not change.")];
  if (first) top.unshift(h("p", {class: "mute"}, "Step 2 of 2"));
  if (!first && !showForm) top.push(h("div", {class: "row", style: "margin-bottom:8px"}, h("button", {class: "btn", type: "button", onclick: () => { state.editing = ""; servicesView(); }}, "Protect a service")));
  const items = svc.services.map((s) => serviceItem(s, svc.running));
  panel.replaceChildren(...top, showForm ? serviceForm(state.editing ? svc.services.find((s) => s.name === state.editing) : null, first) : "",
    items.length ? h("div", {class: "section"}, ...items) : "", guardSection(svc));
}

function serviceItem(s, running) {
  const acts = h("div", {class: "row inline-acts", style: "margin-top:10px"});
  if (s.managed) {
    acts.append(h("button", {class: "btn quiet small", type: "button", "aria-label": "Check " + s.host, onclick: () => { state.check = {target: "127.0.0.1:" + s.port, name: s.host, trust: s.policy === "transition" && s.public_cert ? "public" : "qcertificate"}; go("check"); }}, "Check connection"));
    if (s.shadow) acts.append(twoStep("Turn on enforcement", "Turn on enforcement for " + s.host, "Confirm: refuse clients that are not quantum-safe", async () => { state.services = await call("services/enforce", {name: s.name}); servicesView(); }));
    else if (s.policy !== "transition") acts.append(twoStep("Watch only", "Watch only " + s.host, "Confirm: serve everyone and only report", async () => { state.services = await call("services/watch", {name: s.name}); servicesView(); }));
    acts.append(h("button", {class: "btn quiet small", type: "button", "aria-label": "Edit " + s.host, onclick: () => { state.editing = s.name; servicesView(); $("#service-form") && $("#service-form").scrollIntoView(); }}, "Edit"));
  }
  acts.append(twoStep("Remove", "Remove " + s.name, "Confirm remove " + s.name, async () => { state.services = await call("services/remove", {name: s.name}); servicesView(); }));
  const reasons = s.status && Object.keys(s.status.reasons || {}).length ? h("p", {class: "legend"}, "Why they would be refused: " + Object.entries(s.status.reasons).map(([r, n]) => r + " (" + n + ")").join("; ")) : "";
  return h("section", {class: "svc", "aria-labelledby": "svc-" + s.name},
    h("div", {class: "row", style: "justify-content:space-between"}, h("h2", {id: "svc-" + s.name}, s.host ? s.host + ":" + s.port : s.name), pill(s)),
    h("p", {class: "sub"}, s.label + " · " + PROTECTION(s) + " · passes traffic to " + s.target),
    h("p", {style: "margin:0"}, seen(s)), reasons,
    s.problems.length ? h("ul", {class: "problems"}, s.problems.map((p) => h("li", {}, p))) : "",
    s.managed ? "" : h("p", {class: "legend"}, "Written by hand in the settings file: edit it there."),
    h("details", {}, h("summary", {class: "mute"}, "Technical details"), h("dl", {class: "kv", style: "margin-top:8px"},
      h("dt", {}, "Policy"), h("dd", {}, TECH(s)), h("dt", {}, "Listens on"), h("dd", {}, s.listen), h("dt", {}, "Certificate"), h("dd", {class: "path"}, s.cert || "none"),
      ...(s.public_cert ? [h("dt", {}, "Public certificate"), h("dd", {class: "path"}, s.public_cert)] : []))),
    acts);
}

const KINDS = [["website", "Public website", "People visit it in a browser. Also needs an ordinary public certificate, such as Let's Encrypt."],
  ["app", "Internal app or API", "Your own staff, apps and scripts connect to it."],
  ["partner", "Partner API", "Only partners holding a certificate from QCertificate get in."],
  ["tcp", "Database or other service", "Any other service, such as PostgreSQL or MQTT."]];
function serviceForm(editing, first) {
  const msg = alertBox();
  let kind = editing ? editing.kind : "website";
  const radios = KINDS.map(([v, label, desc]) => h("label", {}, h("input", {type: "radio", name: "kind", value: v, checked: v === kind, onchange: () => { kind = v; sync(); }}), h("span", {}, h("strong", {}, label), h("span", {class: "mute"}, desc))));
  const host = h("input", {type: "text", id: "s-host", autocomplete: "off", placeholder: "shop.example.com", value: editing ? editing.host : "", "aria-describedby": "s-host-hint"});
  const port = h("input", {type: "number", id: "s-port", min: "1", max: "65535", value: editing ? String(editing.port) : "443", "aria-describedby": "s-port-hint"});
  const target = h("input", {type: "text", id: "s-target", autocomplete: "off", placeholder: "127.0.0.1:8080", value: editing ? editing.target : "", "aria-describedby": "s-target-hint"});
  const pub = h("input", {type: "text", id: "s-pub", autocomplete: "off", placeholder: "/etc/letsencrypt/live/shop.example.com/fullchain.pem", value: editing ? editing.public_cert : ""});
  const pubKey = h("input", {type: "text", id: "s-pubkey", autocomplete: "off", placeholder: "/etc/letsencrypt/live/shop.example.com/privkey.pem", value: editing ? editing.public_key : ""});
  const watch = h("input", {type: "checkbox", id: "s-watch", checked: editing ? editing.shadow : true});
  const publicBox = h("div", {}, h(first ? "h2" : "h3", {style: "margin-top:22px"}, "Public certificate for browsers"),
    h("p", {class: "legend"}, "Browsers only trust public authorities, and these do not issue quantum-safe certificates yet. With an ordinary public certificate here, browsers connect normally and the key exchange is still quantum-safe. Without one, visitors see \"Your connection is not private\"."),
    ...field("s-pub", "Full chain file (optional)", pub), ...field("s-pubkey", "Its key file", pubKey));
  const watchBox = h("div", {}, h("label", {class: "check", for: "s-watch", style: "margin-top:18px"}, watch, h("span", {}, "Start by watching: serve everyone as today and report who would be refused. Turn on enforcement when nobody would be.")));
  const tech = h("p", {class: "legend"});
  function sync() {
    publicBox.hidden = kind !== "website"; watchBox.hidden = kind === "website";
    tech.textContent = "Settings written: policy " + (kind === "website" ? "transition" : "strict") + (kind !== "website" && watch.checked ? ", shadow" : "") + (kind !== "tcp" ? ", forwarded_headers (the app sees the visitor's address and https)" : "") + (kind === "partner" ? ", require_client_cert with QCertificate's revocation list" : "") + ", sni (chosen by name on a shared port).";
  }
  watch.addEventListener("change", sync);
  const submit = async (ev) => {
    ev.preventDefault();
    const body = {kind, host: host.value.trim(), port: Number(port.value), target: target.value.trim(), watch: kind !== "website" && watch.checked};
    if (kind === "website") { body.public_cert = pub.value.trim(); body.public_key = pubKey.value.trim(); }
    if (editing) body.original = editing.name;
    try { state.services = await call("services/save", body, msg); state.editing = null; state.first = false; servicesView(); } catch (e) {}
  };
  const form = h("form", {class: "form", id: "service-form", onsubmit: submit}, first ? "" : h("h2", {}, editing ? "Edit " + editing.host : "Protect a service"),
    h("fieldset", {}, h("legend", {}, "What is it?"), h("div", {class: "choices"}, radios)),
    h("div", {class: "form-row"}, h("div", {}, ...field("s-host", "Address people use", host, "The name in the address bar or in the client's settings, such as shop.example.com.")),
      h("div", {}, ...field("s-port", "Port", port, "443 for a website."))),
    ...field("s-target", "Where it runs now", target, "Where QGuard passes the traffic on to: the service's current address, usually on this computer, such as 127.0.0.1:8080."),
    publicBox, watchBox, h("details", {style: "margin-top:16px"}, h("summary", {class: "mute"}, "Technical details"), tech),
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", type: "submit"}, editing ? "Save changes" : "Protect service"),
      editing || !first ? h("button", {class: "btn quiet", type: "button", onclick: () => { state.editing = null; servicesView(); }}, "Cancel") : ""),
    msg);
  sync();
  return form;
}

function guardSection(svc) {
  const msg = alertBox();
  const start = async () => { try { state.services = await call("guard/start", {}, msg); servicesView(); } catch (e) {} };
  const stop = async () => { try { state.services = await call("guard/stop", {}, msg); servicesView(); } catch (e) {} };
  const acts = h("div", {class: "row", style: "margin-top:10px"});
  if (!svc.running && svc.services.length) acts.append(h("button", {class: "btn", type: "button", onclick: start}, "Start QGuard on this computer"));
  if (svc.started_here) acts.append(h("button", {class: "btn quiet", type: "button", onclick: stop}, "Stop QGuard"));
  acts.append(h("button", {class: "btn quiet", type: "button", onclick: () => servicesView()}, "Refresh"));
  return h("section", {class: "section", "aria-labelledby": "guard-h"}, h("h2", {id: "guard-h"}, "QGuard on this computer"),
    h("p", {style: "margin:0"}, svc.running ? (svc.started_here ? "QGuard is running, started from this console. It keeps running when you close the console." : "QGuard is running (as a system service, or from a terminal).") : "QGuard is not running."),
    h("p", {class: "legend"}, "QGuard reads its settings from ", h("span", {class: "path"}, svc.settings), " and applies every change you save here within seconds. For a server, run it as a system service so it starts with the computer: the manual's \"Running it in production\" section shows how on Linux and Windows."),
    acts, msg);
}

// ---- QCertificate

async function caView() {
  const panel = $("#panel");
  loading(state.status.name);
  let s, auth;
  try { state.status = s = await call("status"); auth = await call("authority"); } catch (e) { return; }
  const issueMsg = alertBox();
  const kind = h("select", {id: "kind"}, h("option", {value: "server"}, "A service"), h("option", {value: "client"}, "A person, device or partner"));
  const cn = h("input", {type: "text", id: "cn", autocomplete: "off", placeholder: "web.example.com", "aria-describedby": "cn-hint"});

async function load() {
  try { state.status = await call("status"); } catch (e) { return signedOut(); }
  if (!state.status.configured) return createCa();
  if (state.status.encrypted && !state.status.unlocked) return unlock();
  try { state.services = await call("services"); } catch (e) { return; }
  if (!state.services.services.length) state.tab = "services";
  shell();
}
